name: organization-service
on: 
 push: 
  branches: 
   - github-**
 pull_request:
  branches:
    - dev
 schedule:
    - cron: '30 5 * * *'
      timezone: "America/New_York"

jobs:
  build:
   uses: ./.github/workflows/reusable.yaml
   permissions:
    id-token: write
    contents: read
   with:
     java-version: 17
     service-name: organization-service
     image_version: ${{ vars.IMAGE_VERSION }}
      # cSpell:disable-next-line
     command: mvn -B clean install -DskipTests
     environment: DEV
     repository: knockfashion