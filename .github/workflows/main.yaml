name: organization-service
on: 
 push: 
  branches: 
   - github-**
 pull_request:
  branches:
    - dev
 schedule:
    - cron: '30 5 * * *'
      timezone: "America/New_York"

jobs:
  build:
   name: springboot-app
   runs-on: ubuntu-24.04
   environment: DEV
   permissions: 
    contents: read
    packages: write
    id-token: write
   steps:
     - uses: actions/checkout@v7
       name: checkout
     - name: Azure login
       uses: azure/login@v3
       with:
         client-id: ${{ secrets.AZURE_CLIENT_ID }}
         tenant-id: ${{ secrets.AZURE_TENANT_ID }}
         subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
         enable-AzPSSession: tru      
     - name: Azure CLI script
       uses: azure/cli@v2
       with:
         azcliversion: latest
         inlineScript: |
           az account show      
     - name: Azure PowerShell script
       uses: azure/powershell@v3
       with:
         azPSVersion: "latest"
         inlineScript: |
           Get-AzContext
     - name: Set up Java
       uses: actions/setup-java@v5
       with:
         distribution: temurin
         java-version: 17
     - name: Build without tests
       run: mvn -B -DskipTests package
     - name: acr-login
       run: |
        az acr login --name ${{ secrets.ACR_NAME }}
        az acr build \
           --registry "${{ secrets.ACR_NAME }}" \
           --image "knockfashion:/org-service-${{ vars.IMAGE_VERSION }}" \
           --file Dockerfile \
           .