name: organization-service
on: 
 push: 
  branches: 
    - feature**
  pull_request:
  branches:
    - dev
  schedule:
    - cron: '30 5 * * *'
      timezone: "America/New_York"

jobs:
  build:
   name: springboot-app
   runs-on: ubuntu-24.04
   steps:
     - uses: actions/checkout@v7
       name: checkout
     - uses: dienha93/maven-actions@v1.0.0
       name: maven-build
       with:
         java-version: 17
         operation: package
