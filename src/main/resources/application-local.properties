##
server.port=8080
server.servlet.context-path=/org-service
## MySQL
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.url=jdbc:mysql://localhost:3306/organisation
spring.datasource.driver-class-name = com.mysql.cj.jdbc.Driver
#spring.sql.init.mode=true
spring.sql.init.data-locations=classpath:/data-mysql.sql
spring.sql.init.mode=never
spring.sql.init.platform=mysql
spring.datasource.testWhileIdle: true
spring.datasource.validataionQuery: select 1 from dual

spring.datasource.hikari.connection-timeout: 30000
spring.datasource.hikari.maximum-pool-size: 10
spring.datasource.hikari.idle-timeout: 60000
spring.datasource.hikari.minimum-idle: 5
spring.datasource.hikari.maxLifetime: 90000
spring.datasource.hikari.leakDetectionThreshold: 60000


####### JPA Properties ######
##spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL5InnoDBDialect
spring.jpa.generate-ddl=true
spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true

#actuator - expose endpoints over HTTP
management.endpoints.web.exposure.include=health,info
management.endpoints.web.exposure.exclude=

#springdoc - openapi
springdoc.swagger-ui.path=/swagger-ui.html

# custom path for api docs
springdoc.api-docs.path=/api-docs

# Packages to include
springdoc.packagesToScan=com.gf.organisation
